name: DevOps CI/CD Pipeline

# 1. Trigger the workflow every time code is pushed to the main branch
on:
  push:
    branches: ["main"]

jobs:
  # Job 1: Test the code
  test:
    runs-on: ubuntu-latest # Running on a free Linux machine hosted by GitHub
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Copies your repository code to the runner

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-node-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install pytest

      - name: Run Tests
        run: |
          pytest test_app.py

  # Job 2: Build the Docker Image (only runs if tests pass)
  build-docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t devops-demo:latest .
          echo "Docker image built successfully!"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devops-demo:latest

  # Job 3: Deploy to Google Cloud Compute Engine
  deploy-gcp:
    needs: build-docker # Only run if the Docker build finishes successfully
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Authenticate with Google Cloud using your secret key
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 2. Setup Google Cloud CLI tools inside the runner
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 3. Tell the VM to restart its Docker container with the new image
      - name: Deploy to Compute Engine Instance
        run: |
          # Update the startup metadata with the execution script
          gcloud compute instances add-metadata devops-free-vm \
            --zone=us-central1-a \
            --metadata=startup-script="#!/bin/bash
              docker stop \$(docker ps -a -q) || true
              docker rm \$(docker ps -a -q) || true
              docker rmi \$(docker images -q) || true
              docker run -d -p 80:80 ${{ secrets.DOCKERHUB_USERNAME }}/devops-demo:latest"

          # Safely reset the virtual instance to force-trigger the fresh script on boot
          gcloud compute instances reset devops-free-vm --zone=us-central1-a
