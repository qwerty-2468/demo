name: DevOps CI/CD Pipeline

# 1. Trigger the workflow every time code is pushed to the main branch
on:
  push:
    branches: ["main"]

jobs:
  # Job 1: Test the code
  test:
    runs-on: ubuntu-latest # Running on a free Linux machine hosted by GitHub
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Copies your repository code to the runner

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-node-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install pytest

      - name: Run Tests
        run: |
          pytest test_app.py

  # Job 2: Build the Docker Image (only runs if tests pass)
  build-docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t devops-demo:latest .
          echo "Docker image built successfully!"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devops-demo:latest

  # Job 3: Deploy to Google Cloud Compute Engine
  deploy-gcp:
    needs: build-docker # Only run if the Docker build finishes successfully
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Authenticate with Google Cloud using your secret key
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 2. Setup Google Cloud CLI tools inside the runner
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 3. Tell the VM to set up an Nginx proxy for the raw IP address
      - name: Deploy to Compute Engine Instance
        run: |
          gcloud config set project qwerty-devops-project-123

          gcloud compute instances add-metadata devops-free-vm \
            --zone=us-central1-a \
            --metadata=startup-script="#!/bin/bash
              # 1. Update system and install Nginx and Docker
              sudo apt-get update -y
              sudo apt-get install -y nginx docker.io
              
              # 2. Configure Nginx to accept ANY incoming connection on Port 80 (including the raw IP)
              sudo cat << 'EOF' > /etc/nginx/sites-available/default
              server {
                  listen 80 default_server; # <-- default_server tells Nginx to catch everything
                  listen [::]:80 default_server;
                  server_name _; # <-- The underscore means catch any domain name or raw IP

                  location / {
                      proxy_pass http://localhost:5000; # Pass it locally to our Python app container
                      proxy_set_header Host \$host;
                      proxy_set_header X-Real-IP \$remote_addr;
                      proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  }
              }
              EOF
              
              # 3. Restart Nginx to apply the configuration change
              sudo systemctl restart nginx

              # 4. Refresh and run the Docker application on internal port 5000
              docker stop \$(docker ps -a -q) || true
              docker rm \$(docker ps -a -q) || true
              docker rmi \$(docker images -q) || true
              docker run -d -p 5000:5000 ${{ secrets.DOCKERHUB_USERNAME }}/devops-demo:latest"

          # Reset the server to flush the old setup and apply the new proxy configuration
          gcloud compute instances reset devops-free-vm --zone=us-central1-a
